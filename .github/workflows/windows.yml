name: Windows installer

# Builds mini-teto-setup.exe on GitHub's own Windows machines: nobody needs Python installed.
# Runs only on a version tag (git tag v1.1.0 && git push origin v1.1.0) or by hand from the Actions tab.
# The installer ends up in a GitHub Release (tags) and in the run's Artifacts.
on:
  push:
    tags: ["v*"]          # only when you push a tag like v1.1.0 (not on every commit)
  workflow_dispatch:      # or by hand: Actions -> Windows installer -> Run workflow

permissions:
  contents: write      # lets the release step publish the files

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the exe
        shell: cmd
        run: windows\build.bat exe
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc windows\mini-teto.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: mini-teto-setup
          path: |
            dist/mini-teto-setup.exe
            dist/mini-teto.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mini-teto-setup.exe
            dist/mini-teto.exe
